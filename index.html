<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MinMapArt Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f3f5f8;
      --panel: rgba(255, 255, 255, 0.92);
      --text: #111827;
      --muted: #5f6b7e;
      --line: #d9dee7;
      --accent: #0b63f6;
      --accent-strong: #084fd0;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(17, 24, 39, 0.09);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at top right, #e5ecff 0%, transparent 48%),
        radial-gradient(circle at 10% 20%, #e8f4ef 0%, transparent 36%),
        var(--bg);
      color: var(--text);
    }

    #app-shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: clamp(1rem, 2vw, 1.5rem);
      display: grid;
      grid-template-columns: minmax(260px, 340px) 1fr;
      gap: 1rem;
      min-height: 100vh;
    }

    #controls {
      position: sticky;
      top: 1rem;
      align-self: start;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      display: grid;
      gap: 1rem;
    }

    .brand {
      display: grid;
      gap: 0.4rem;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.45rem);
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .control-group {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.8rem;
      background: #fff;
      display: grid;
      gap: 0.65rem;
    }

    .group-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4b5563;
      margin: 0;
    }

    .field {
      display: grid;
      gap: 0.35rem;
    }

    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
    }

    input, select, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #cfd5df;
      padding: 0.62rem 0.72rem;
      transition: 0.2s ease;
    }

    input:focus, select:focus, button:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(11, 99, 246, 0.16);
    }

    .inline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.45rem;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.45rem;
    }

    button {
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      border-color: #b5c1d5;
      transform: translateY(-1px);
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    #status {
      min-height: 1.2em;
      margin: 0;
      font-size: 0.86rem;
      color: #334155;
    }

    #status.success { color: #0f7a45; }
    #status.error { color: #b00020; }

    #preview-wrap {
      display: grid;
      gap: 0.65rem;
      min-height: calc(100vh - 2rem);
      align-content: center;
    }

    #preview-meta {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.84rem;
      color: #485468;
      padding: 0 0.2rem;
    }

    #preview {
      background: #fff;
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      border: 1px solid #fff;
      aspect-ratio: 17 / 11;
      width: min(1020px, 100%);
      max-height: calc(100vh - 112px);
      display: flex;
      flex-direction: column;
      padding: clamp(14px, 2vw, 24px);
      overflow: hidden;
    }

    #map {
      flex: 1;
      min-height: 360px;
      border: 2px solid #1f2937;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    #map::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22%;
      z-index: 1000;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0), #fff);
    }

    #title-text,
    #coord-text {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      z-index: 1001;
      color: #111;
    }

    #title-text {
      bottom: 1.35em;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: clamp(34px, 4.9vw, 52px);
      font-weight: 700;
      line-height: 1;
      text-transform: uppercase;
    }

    #coord-text {
      bottom: 0.7em;
      font-family: 'Roboto Condensed', sans-serif;
      font-size: clamp(14px, 2vw, 18px);
      letter-spacing: 0.01em;
    }

    #zoom-text {
      position: absolute;
      top: 0.8em;
      right: 0.9em;
      padding: 0.32em 0.58em;
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
      z-index: 1001;
      pointer-events: none;
      font-family: 'Roboto Condensed', sans-serif;
    }

    @media (max-width: 1024px) {
      #app-shell {
        grid-template-columns: 1fr;
      }

      #controls {
        position: static;
      }

      #preview {
        max-height: none;
      }

      #map {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>
  <main id="app-shell">
    <section id="controls">
      <div class="brand">
        <h1>MinMapArt Studio</h1>
        <p>Create clean, printable location art in seconds—search, style, and export like a premium map poster tool.</p>
      </div>

      <div class="control-group">
        <p class="group-title">Location</p>
        <div class="field">
          <label for="search">Search place</label>
          <div class="inline">
            <input id="search" list="suggestions" placeholder="Try: Barcelona, Spain" />
            <button id="search-btn" class="primary">Search</button>
          </div>
          <datalist id="suggestions"></datalist>
        </div>
        <button id="locate-btn">Use Current Location</button>
      </div>

      <div class="control-group">
        <p class="group-title">Poster text</p>
        <div class="field">
          <label for="title">Map title</label>
          <input id="title" placeholder="Map title…" />
        </div>
      </div>

      <div class="control-group">
        <p class="group-title">Style</p>
        <div class="field">
          <label for="basemap-select">Basemap</label>
          <select id="basemap-select">
            <option value="lines">Toner Lines (minimal)</option>
            <option value="toner">Toner (high contrast)</option>
            <option value="lite">Toner Lite (soft)</option>
          </select>
        </div>
        <div class="button-grid">
          <button id="orientation-btn">Switch to Portrait</button>
          <button id="reset-btn">Reset View</button>
        </div>
      </div>

      <div class="control-group">
        <p class="group-title">Export & share</p>
        <div class="button-grid">
          <button id="copy-coords">Copy Coordinates</button>
          <button id="copy-link">Copy Share Link</button>
          <button id="export" class="primary" style="grid-column: 1 / -1;">Export PDF</button>
        </div>
      </div>

      <p id="status" class="info" aria-live="polite"></p>
    </section>

    <section id="preview-wrap">
      <div id="preview-meta">
        <span id="center-readout">Center: --</span>
        <span id="style-readout">Style: Toner Lines</span>
      </div>
      <div id="preview">
        <div id="map">
          <div id="title-text"></div>
          <div id="coord-text"></div>
          <div id="zoom-text"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-geosearch@3.1.0/dist/bundle.min.js"></script>
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
